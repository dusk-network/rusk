name: Rusk binary copy 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Make rusk
    runs-on: core
    steps:
      - name: Prepare sources
        shell: bash
        run: |
          set -euo pipefail

          WORKDIR_BASE="/var/opt/build-cache/ci"
          WORKDIR="${WORKDIR_BASE}/${GITHUB_RUN_ID}-${GITHUB_JOB}"
          echo "WORKDIR=${WORKDIR}" >> "$GITHUB_ENV"

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          REPO_URL="https://x-access-token:${{ secrets.PLONK_PRIVATE_READ_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git clone "$REPO_URL" "$WORKDIR/repo"

          cd "$WORKDIR/repo"
          if [ -n "${GITHUB_REF:-}" ]; then
            git fetch origin "+${GITHUB_REF}:ci_ref"
            git checkout ci_ref
          else
            git checkout "${GITHUB_SHA}"
          fi

      - name: Add Rust tools to PATH
        shell: bash
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Configure git auth for private dependencies
        shell: bash
        run: |
          set -euo pipefail
          export GIT_CONFIG_GLOBAL="${WORKDIR}/.gitconfig"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global url."https://x-access-token:${{ secrets.PLONK_PRIVATE_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build rusk
        working-directory: ${{ env.WORKDIR }}/repo
        run: make rusk

      - name: sccache stats
        if: always()
        run: sccache -s || true

      - name: "Check and Copy Rusk Artifact to Host"
        continue-on-error: true
        run: |
          # Ensure the target directory exists
          mkdir -p /var/opt/rusk-artifacts
          
          # Check if the rusk artifact exists before copying
          if [ -f "${WORKDIR}/repo/target/release/rusk" ]; then
            echo "Rusk artifact found. Copying to host."
            cp "${WORKDIR}/repo/target/release/rusk" /var/opt/rusk-artifacts
          else
            echo "Rusk artifact not found. Skipping copy."
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "${WORKDIR:-}" || true
