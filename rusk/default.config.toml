[archive]
#events_cf_max_write_buffer_size = 1048576  # 1 MiB
#events_cf_disable_block_cache = false
#enable_debug = false
#reader_max_connections = 16

[http]
#listen = true
#listen_address = '127.0.0.1:8080'
#cert = <path_of_pem>
#key = <path_of_key>

# The default max cost for feeder calls is 3 billion.
#feeder_call_gas = 3_000_000_000

#ws_sub_channel_cap = 16,
#ws_event_channel_cap = 1024,

# Custom headers to put into every HTTP response. By default none are added.
#headers = [["name1", "value1"], ["name2", "value2"]]

# Endpoint policy for ACL and global endpoint-class limits.
#[http.policy]
#enabled = true

#[http.policy.acl]
#enabled = true
#default_action = "allow"

## Example deny rule. Rules are evaluated top-to-bottom (first match wins).
##[[http.policy.acl.rules]]
##id = "deny-contracts-upload"
##enabled = true
##action = "deny"
##path = "/on/contract:*/upload_driver"
##method = ["POST"]
##headers = {}

#[http.policy.global_limits]
#enabled = true

#[http.policy.global_limits.classes.contract_query]
#rps = 180
#burst = 360
#concurrency = 12

#[http.policy.global_limits.classes.feeder_query]
#rps = 3
#burst = 6
